<style>
:root{--sky-top:#dce8ee;--sky-bot:#f5ede0;--mtn-far:#c3cfd2;--mtn-mid:#9fb2ab;--forest:#5d786b;--meadow-1:#b6c79a;--meadow-2:#9db37f;--spruce:#3f5b4d;--birch:#a9be7a;--path:#e3d6bd;--bg:#fbf6ec;--card:#ffffff;--soft:#f4efe4;--text:#1f1e1c;--muted:#6b6a65;--faint:#9a9890;--line:rgba(0,0,0,.09);--line-strong:rgba(0,0,0,.22);--fill:#1D9E75;--house:#534AB7;--ok-bg:#e3f4ec;--ok:#0f6e56;--warn-bg:#faeeda;--warn:#854f0b;--err-bg:#fcebeb;--err:#a32d2d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky-top:#1b2a35;--sky-bot:#2f2a24;--mtn-far:#33424a;--mtn-mid:#2c3d38;--forest:#22362d;--meadow-1:#33452a;--meadow-2:#2a3a22;--spruce:#1b2e24;--birch:#4d5f33;--path:#4a4234;--bg:#1c1c1b;--card:#262624;--soft:#30302d;--text:#f1efe8;--muted:#b4b2a9;--faint:#888780;--line:rgba(255,255,255,.1);--line-strong:rgba(255,255,255,.28);--fill:#2fb589;--house:#8f88e6;--ok-bg:#0d3a2e;--ok:#9fe1cb;--warn-bg:#412402;--warn:#fac775;--err-bg:#501313;--err:#f7c1c1}}
:root[data-theme="dark"]{--sky-top:#1b2a35;--sky-bot:#2f2a24;--mtn-far:#33424a;--mtn-mid:#2c3d38;--forest:#22362d;--meadow-1:#33452a;--meadow-2:#2a3a22;--spruce:#1b2e24;--birch:#4d5f33;--path:#4a4234;--bg:#1c1c1b;--card:#262624;--soft:#30302d;--text:#f1efe8;--muted:#b4b2a9;--faint:#888780;--line:rgba(255,255,255,.1);--line-strong:rgba(255,255,255,.28);--fill:#2fb589;--house:#8f88e6;--ok-bg:#0d3a2e;--ok:#9fe1cb;--warn-bg:#412402;--warn:#fac775;--err-bg:#501313;--err:#f7c1c1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:440px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:.5px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
h1{font-size:22px;font-weight:600;margin:2px 0 0}
h2{font-size:17px;font-weight:600;margin:0 0 10px}
.eyebrow{font-size:13px;color:var(--muted);margin:0}
.small{font-size:12px;color:var(--faint);margin:2px 0 0}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;gap:8px}
.muted{color:var(--muted)}
.therm-wrap{display:flex;gap:18px;margin-top:18px}
.therm{position:relative;width:128px;height:300px;flex-shrink:0}
.tube{position:absolute;left:0;top:0;bottom:0;width:38px;border-radius:19px;background:var(--soft);border:.5px solid var(--line);overflow:hidden}
.mercury{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,#0F6E56,#1D9E75 55%,#5DCAA5);transition:height .9s ease}
.mark{position:absolute;left:32px;right:0;display:flex;align-items:center;gap:6px;transform:translateY(50%);font-size:12px;color:var(--muted);white-space:nowrap}
.mark span.tick{width:12px;border-top:1px solid var(--line-strong)}
.mark.done{color:var(--ok)}
.mark.goal{color:var(--text);font-weight:600}
.stats{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.big{font-size:38px;font-weight:600;line-height:1.05;margin:0}
.tile{background:var(--soft);border-radius:10px;padding:10px 12px}
.tile p{margin:0}
.tile .lbl{font-size:12px;color:var(--muted)}
.tile .val{font-size:18px;font-weight:600}
.pill{border-radius:10px;padding:8px 12px;font-size:13px;margin:0}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.neutral{background:var(--soft);color:var(--muted)}
.sep{border-top:.5px solid var(--line);margin-top:16px;padding-top:12px}
.bar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin:6px 0 4px}
.bar.big{height:14px;border-radius:7px}
.bar>div{height:100%;width:0;background:var(--fill);border-radius:inherit;transition:width .9s ease}
.bar.house>div{background:linear-gradient(90deg,#534AB7,#7F77DD)}
.pot{margin-bottom:14px;display:flex;gap:12px;align-items:center}
.pot .ico{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.pot .body{flex:1;min-width:0}
.hero{margin:-20px -20px 16px;border-radius:16px 16px 0 0;overflow:hidden;line-height:0}
.hero svg{width:100%;height:auto;display:block}
h2 svg.i{vertical-align:-4px;margin-right:6px}
.cheer{font-size:13px;color:var(--muted);margin:10px 0 0}
.pot:last-child{margin-bottom:0}
.hist{font-size:14px}
.hist div{display:flex;justify-content:space-between;padding:4px 0}
.notice{border-radius:12px;padding:14px;font-size:14px;line-height:1.5;margin-bottom:14px}
.notice.err{background:var(--err-bg);color:var(--err)}
.notice.info{background:var(--soft);color:var(--muted)}
footer{text-align:center;font-size:12px;color:var(--faint);margin-top:8px}
button.link{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
</style>
</head>

<script>
const SHEET_ID = "1z8c4szzUWjCxsQbOJG7rWNH6L0gdKWZxZSLLC3Mp47k";
const CSV_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv";

const GOAL = 90000;
const ESSENTIALS = 20263;
const HOUSE_GOAL = 1500000;
const MONTHLY_SAVING = 34410;

const MILESTONES = [
  { label: "1 month",  amount: 1 * ESSENTIALS, planned: "Feb 2027" },
  { label: "2 months", amount: 2 * ESSENTIALS, planned: "Feb 2027" },
  { label: "3 months", amount: 3 * ESSENTIALS, planned: "Mar 2027" },
  { label: "4 months", amount: 4 * ESSENTIALS, planned: "Mar 2027" },
  { label: "Goal 90k", amount: GOAL,           planned: "Apr 2027", goal: true }
];

const ICONS = {"plane": "<path stroke=\"none\" d=\"M0 0h24v24H0z\" fill=\"none\"/>  <path d=\"M16 10h4a2 2 0 0 1 0 4h-4l-4 7h-3l2 -7h-4l-2 2h-3l2 -4l-2 -4h3l2 2h4l-2 -7h3z\" />", "beach": "<path stroke=\"none\" d=\"M0 0h24v24H0z\" fill=\"none\"/>  <path d=\"M17.553 16.75a7.5 7.5 0 0 0 -10.606 0\" />  <path d=\"M18 3.804a6 6 0 0 0 -8.196 2.196l10.392 6a6 6 0 0 0 -2.196 -8.196z\" />  <path d=\"M16.732 10c1.658 -2.87 2.225 -5.644 1.268 -6.196c-.957 -.552 -3.075 1.326 -4.732 4.196\" />  <path d=\"M15 9l-3 5.196\" />  <path d=\"M3 19.25a2.4 2.4 0 0 1 1 -.25a2.4 2.4 0 0 1 2 1a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 2 -1a2.4 2.4 0 0 1 2 -1a2.4 2.4 0 0 1 2 1a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 2 -1a2.4 2.4 0 0 1 2 -1a2.4 2.4 0 0 1 1 .25\" />", "umbrella": "<path stroke=\"none\" d=\"M0 0h24v24H0z\" fill=\"none\"/>  <path d=\"M4 12a8 8 0 0 1 16 0z\" />  <path d=\"M12 12v6a2 2 0 0 0 4 0\" />", "car": "<path stroke=\"none\" d=\"M0 0h24v24H0z\" fill=\"none\"/>  <path d=\"M7 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0\" />  <path d=\"M17 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0\" />  <path d=\"M5 17h-2v-6l2 -5h9l4 5h1a2 2 0 0 1 2 2v4h-2m-4 0h-6m-6 -6h15m-6 0v-5\" />", "calendar-event": "<path stroke=\"none\" d=\"M0 0h24v24H0z\" fill=\"none\"/>  <path d=\"M4 5m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z\" />  <path d=\"M16 3l0 4\" />  <path d=\"M8 3l0 4\" />  <path d=\"M4 11l16 0\" />  <path d=\"M8 15h2v2h-2z\" />", "receipt-tax": "<path stroke=\"none\" d=\"M0 0h24v24H0z\" fill=\"none\"/>  <path d=\"M9 14l6 -6\" />  <circle cx=\"9.5\" cy=\"8.5\" r=\".5\" fill=\"currentColor\" />  <circle cx=\"14.5\" cy=\"13.5\" r=\".5\" fill=\"currentColor\" />  <path d=\"M5 21v-16a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v16l-3 -2l-2 2l-2 -2l-2 2l-2 -2l-3 2\" />"};
const POTS = [
  { key: "UK visits",    label: "UK visits",    target: 24000, icon: "plane",          color: "#378ADD", tint: "rgba(55,138,221,.15)" },
  { key: "Holiday",      label: "Holiday",      target: 21600, icon: "beach",          color: "#D85A30", tint: "rgba(216,90,48,.15)" },
  { key: "Unexpected",   label: "Unexpected",   target: 24000, icon: "umbrella",       color: "#BA7517", tint: "rgba(239,159,39,.18)" },
  { key: "Car",          label: "Car",          target: 9600,  icon: "car",            color: "#7F77DD", tint: "rgba(127,119,221,.16)" },
  { key: "Yearly bills", label: "Yearly bills", target: 3600,  icon: "calendar-event", color: "#D4537E", tint: "rgba(212,83,126,.15)" },
  { key: "Taxes",        label: "Taxes",        target: 21800, icon: "receipt-tax",    color: "#5F8F3A", tint: "rgba(99,153,34,.16)", note: "Paid each spring for the year before" }

const fmt = n => Math.round(n).toLocaleString("en-GB");
const kc = n => fmt(n) + " Kč";
const monthName = d => d.toLocaleDateString("en-GB", { month: "short", year: "numeric" });
const dayName = d => d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });

function planReserve(date) {
  const steps = [[2027,0,16,17410],[2027,1,16,MONTHLY_SAVING],[2027,2,16,MONTHLY_SAVING],[2027,3,16,MONTHLY_SAVING]];
  let total = 0;
  for (const [y,m,d,v] of steps) if (date >= new Date(y,m,d)) total += v;
  return Math.min(total, GOAL);
}

function planHouse(date) {
  const start = new Date(2027,3,16);
  if (date < start) return 0;
  let total = 17410 + 3 * MONTHLY_SAVING - GOAL;
  let d = new Date(2027,4,16);
  while (d <= date) { total += MONTHLY_SAVING; d = new Date(d.getFullYear(), d.getMonth() + 1, 16); }
  return total;
}

function parseCSV(text) {
  const rows = []; let row = []; let cell = ""; let q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i+1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i+1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}

function parseNum(s) {
  if (s == null) return null;
  s = String(s).replace(/[\s  ]|Kč|CZK/gi, "");
  if (s === "") return null;
  if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, "");
  else if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, "").replace(",", ".");
  else if (/^-?\d+,\d{1,2}$/.test(s)) s = s.replace(",", ".");
  const n = Number(s);
  return isFinite(n) ? n : null;
}

function parseDate(s) {
  s = String(s || "").trim();
  let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1], +m[2]-1, +m[3]);
  if ((m = s.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/))) return new Date(+m[3], +m[2]-1, +m[1]);
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return new Date(+m[3], +m[1]-1, +m[2]);
  if ((m = s.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})\)/))) return new Date(+m[1], +m[2], +m[3]);
  return null;
}

function notice(kind, html) {
  document.getElementById("notice").innerHTML = html ? '<div class="notice ' + kind + '">' + html + "</div>" : "";
}

function renderMarks(balance) {
  document.getElementById("marks").innerHTML = MILESTONES.slice().reverse().map(m => {
    const done = balance >= m.amount;
    const cls = "mark" + (m.goal ? " goal" : "") + (done && !m.goal ? " done" : "");
    return '<div class="' + cls + '" style="bottom:' + (m.amount / GOAL * 100) + '%"><span class="tick"></span>' + (done ? "✓ " : "") + m.label + "</div>";
  }).join("");
}

function render(entries) {
  const latest = entries[entries.length - 1];
  const balance = latest ? latest.values["Safety net"] || 0 : 0;
  const date = latest ? latest.date : new Date();

  document.getElementById("updated").textContent = latest ? "Updated " + dayName(latest.date) : "No entries yet";

  const pct = Math.min(balance / GOAL, 1);
  requestAnimationFrame(() => { document.getElementById("mercury").style.height = (pct * 100) + "%"; });
  renderMarks(balance);
  document.getElementById("pct").textContent = Math.round(balance / GOAL * 100) + "%";
  document.getElementById("saved").textContent = kc(balance);
  document.getElementById("months").textContent = (balance / ESSENTIALS).toFixed(1) + " months";

  const vs = document.getElementById("vsplan");
  const plan = planReserve(date);
  const diff = balance - plan;
  if (!latest) { vs.className = "pill neutral"; vs.textContent = "Add your first entry to the sheet"; }
  else if (balance >= GOAL) { vs.className = "pill ok"; vs.textContent = "Safety net is full"; }
  else if (plan === 0) { vs.className = "pill neutral"; vs.textContent = "Saving starts January 2027"; }
  else if (Math.abs(diff) <= 500) { vs.className = "pill ok"; vs.textContent = "Right on plan"; }
  else if (diff > 0) { vs.className = "pill ok"; vs.textContent = fmt(diff) + " ahead of plan"; }
  else { vs.className = "pill warn"; vs.textContent = fmt(-diff) + " behind plan"; }

  const doneCount = MILESTONES.filter(m => balance >= m.amount).length;
  const cheers = ["Every koruna counts. Let's go!", "First month covered. Nice start!", "Two months safe. Keep going!", "Three months. Almost there!", "Four months of calm. One last push!", "We did it! Safety net is full."];
  document.getElementById("cheer").textContent = latest ? cheers[doneCount] : "";
  const next = MILESTONES.find(m => balance < m.amount);
  document.getElementById("next").textContent = next ? next.label + " (" + fmt(next.amount) + ") · planned " + next.planned : "All milestones reached";
  document.getElementById("goaldate").textContent = balance >= GOAL ? "Done" : "planned Apr 2027";

  const house = latest ? latest.values["House fund"] || 0 : 0;
  const hp = house / HOUSE_GOAL * 100;
  document.getElementById("houseAmt").textContent = kc(house) + " of " + fmt(HOUSE_GOAL);
  document.getElementById("housePct").textContent = (hp < 10 ? hp.toFixed(1) : Math.round(hp)) + "%";
  requestAnimationFrame(() => { document.getElementById("houseBar").style.width = Math.min(Math.max(hp, house > 0 ? 1 : 0), 100) + "%"; });
  const hPlan = planHouse(date);
  let hNote;
  if (house === 0 && balance < GOAL) hNote = "Starts when the safety net is full · planned Apr 2027";
  else if (hPlan === 0) hNote = "Saving about " + fmt(MONTHLY_SAVING) + " Kč a month";
  else {
    const hd = house - hPlan;
    hNote = Math.abs(hd) <= 1000 ? "Right on plan" : (hd > 0 ? fmt(hd) + " ahead of plan" : fmt(-hd) + " behind plan");
    const left = Math.max(HOUSE_GOAL - house, 0);
    const eta = new Date(date.getFullYear(), date.getMonth() + Math.ceil(left / MONTHLY_SAVING), 1);
    hNote += " · goal around " + monthName(eta);
  }
  document.getElementById("houseNote").textContent = hNote;

  document.getElementById("pots").innerHTML = POTS.map(p => {
    const v = latest ? latest.values[p.key] || 0 : 0;
    const pc = Math.round(v / p.target * 100);
    return '<div class="pot"><div class="ico" style="background:' + p.tint + ';color:' + p.color + '"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[p.icon] + '</svg></div><div class="body">' +
      '<div class="row"><span>' + p.label + '</span><span class="muted">' + fmt(v) + " / " + fmt(p.target) + ' · <b style="color:var(--text)">' + pc + "%</b></span></div>" +
      '<div class="bar"><div style="width:' + Math.min(pc, 100) + '%;background:' + p.color + '"></div></div>' +
      (p.note ? '<p class="small">' + p.note + "</p>" : "") + "</div></div>";
  }).join("");

  if (entries.length) {
    document.getElementById("history").innerHTML = entries.slice(-6).reverse().map(e =>
      "<div><span>" + dayName(e.date) + "</span><span>" + kc(e.values["Safety net"] || 0) + "</span></div>").join("");
  }
}

async function load() {
  notice("", "");
  try {
    const res = await fetch(CSV_URL + "&cachebust=" + Date.now());
    const text = await res.text();
    if (!res.ok || /^\s*</.test(text)) throw new Error("not shared");
    const rows = parseCSV(text);
    const header = rows.shift().map(h => h.trim());
    const entries = rows.map(r => {
      const values = {};
      header.forEach((h, i) => { if (i > 0) values[h] = parseNum(r[i]); });
      return { date: parseDate(r[0]), values };
    }).filter(e => e.date && e.values["Safety net"] != null).sort((a, b) => a.date - b.date);
    render(entries);
  } catch (e) {
    render([]);
    notice("err", "Couldn't read the data sheet. Check that it's shared as “Anyone with the link can view”.");
  }
}

document.getElementById("reload").addEventListener("click", load);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
load();
</script>
